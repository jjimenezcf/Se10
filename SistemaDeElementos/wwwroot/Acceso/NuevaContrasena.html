<!DOCTYPE html>
<html>
<head>
    <title>Nueva Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/Conectar.css">

    <!-- literales: mismos ficheros y orden que ListaDeScripts.cs -->
    <script src="/js/_Literales/literales_Basicos.js"></script>
    <script src="/js/_Literales/literales_Enumerados.js"></script>
    <script src="/js/_Literales/literales_Controladores.js"></script>
    <script src="/js/_Literales/literales_Atributos.js"></script>
    <script src="/js/_Literales/literales_Controles.js"></script>
    <script src="/js/_Literales/literales_Css.js"></script>
    <script src="/js/_Literales/literales_Ajax.js"></script>
    <script src="/js/_Literales/literales_Eventos.js"></script>
    <script src="/js/_Literales/literales_Propiedades.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Entorno.js"></script>
    <script src="/js/_Literales/literales_Propiedades_SisDoc.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Terceros.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Juridico.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Logistica.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Venta.js"></script>
    <script src="/js/_Literales/literales_Propiedades_Gasto.js"></script>
    <script src="/js/_Literales/literales_Menus.js"></script>
    <script src="/js/_Literales/literales_Svg.js"></script>
    <script src="/js/_Literales/literales_Html.js"></script>
    <script src="/js/Mensajes.js"></script>
    <script src="/js/Diccionario.js"></script>
    <script src="/js/_TiposDeDatos/TiposDeDatos.js"></script>
    <script src="/js/Utilidades.js"></script>
    <script src="/js/_Api/ApiDeAjax.js"></script>
    <script src="/js/Registro.js"></script>
    <script src="/js/Acceso/Conectar.js"></script>
</head>
<body>
    <div id="NuevaContrasena">

        <div style="text-align: center; ">
            <div class="mb-5">
                <h2 style="font-weight: bold; color: cornflowerblue; font-size: 2.5rem;">Indique la nueva contraseña</h2>
            </div>
            <input type="hidden" id="guid_cambio">

            <div class="input-group input-group-lg">
                <span class="label-icono"><i class="fas fa-key"></i></span>
                <input id="password_nueva" type="password" class="form-control" placeholder="Nueva contraseña">
            </div>
            <br>
            <div class="input-group input-group-lg">
                <span class="label-icono"><i class="fas fa-check-double"></i></span>
                <input id="password_confirmar" type="password" class="form-control" placeholder="Repetir contraseña">
            </div>
            <br>
            <br>
            <button class="btn btn-lg btn-primary btn-block" onclick="Acceso.AlPulsarNuevaContrasena()">Aceptar</button>
        </div>

        <div class="alert d-flex align-items-center" id="div-info-conexion" style="display: none; margin-top: 10px;">
            <span class="label-icono me-2"><i class="fas fa-info"></i></span>
            <span id="info-conexion"></span>
        </div>
    </div>

</body>
</html>
